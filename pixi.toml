[workspace]
name = "joint-track-machine-learning"
version = "0.1.0"
description = "Joint Track Machine Learning Project"
authors = ["Your Name <your.email@example.com>"]
channels = ["https://prefix.dev/conda-forge"]
platforms = [{ platform = "linux-64", cuda = "13.3" }]

[dependencies]
# Core dependencies
opencv = ">=5.0.0,<6"
pytorch-gpu = ">=2.13.0,<3"
cuda-version = ">=13.0,<13.4"
cuda = ">=13.3.1,<14"
eigen = ">=5.0.1,<6"
ninja = ">=1.13.2,<2"
nvtx = ">=0.2.16,<0.3"

# Display dependencies
xorg-libx11 = ">=1.8.13,<2"
xorg-libxt = ">=1.3.1,<2"
xorg-libxext = ">=1.3.7,<2"
curl = ">=8.18.0,<9"
libcurl = ">=8.18.0,<9"
cmake = ">=4.2.3,<5"
wget = ">=1.25.0,<2"
tar = ">=1.35,<2"
ccache = ">=4.14,<5"
#gcc = "*"
sdl2 = ">=2.32.56,<3"
libopengl = ">=1.7.0,<2"
glew = ">=2.3.0,<3"
libegl-devel = ">=1.7.0,<2"
libgles-devel = ">=1.7.0,<2"
libopengl-devel = ">=1.7.0,<2"
clang-tools = "21.*"
catch2 = ">=3.16.0,<4"
qt6-main = ">=6.10.2,<7"
qt6-wayland = ">=6.10.2,<7"
cuda-toolkit = ">=13.3.1,<14"
bibtexparser = ">=1.4.4,<2"
clang = "21.*"
clangxx = "21.*"
cuda-nvtx-dev = ">=13.3.29,<14"
cuda-nvtx = ">=13.3.29,<14"
pyyaml = ">=6.0.3,<7"
rust = ">=1.98.0,<1.99"
llvm = "21.*"

[feature.build.dependencies]
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
#gcc = "*"
pkg-config = ">=0.29.2,<0.30"

# Development dependencies
[feature.dev.dependencies]
freetype = ">=2.14.3,<3"
fontconfig = ">=2.18.3,<3"
expat = ">=2.8.1,<3"
libpng = ">=1.6.58,<2"
zlib = ">=1.3.2,<2"
brotli = ">=1.2.0,<2"
pkg-config = ">=0.29.2,<0.30"

[tasks.build-vtk]
cmd = ["./vtk_installer.sh"]
default-environment = "default"
inputs = ["vtk_installer.sh"]
outputs = ["_deps/vtk/install/lib64/cmake/vtk-9.7/VTKConfig.cmake"]

[tasks.configure]
# Preset-based configure (pixi-base -> release). Keep depends-on build-vtk so the
# VTK cache gate still applies; CMakePresets.json owns all -D flags now.
cmd = ["cmake", "--preset", "release"]
depends-on = [
    { task = "build-vtk", environment = "default" }
]

# (legacy QML profiling note removed — the Widgets app's profile build no longer pulls
# QT_QML_DEBUG; that concern is a separate QML-profile concern if you ever need it.)
[tasks.configure-profiling]
# Preset-based profiling configure (pixi-base -> profile = RelWithDebInfo + -O3 + frame
# pointers + CUDA -lineinfo; no tests / no Study2Grid / no experimental QML). So the
# `.build-prof` tree stays clean and small.
cmd = ["cmake", "--preset", "profile"]
depends-on = [
    { task = "build-vtk", environment = "default" }
]

[tasks.build-profiling]
cmd = ["cmake", "--build", "--preset", "profile"]
depends-on = ["configure-profiling"]

[tasks.build]
# Build task that depends on configure
cmd = ["cmake", "--build", "--preset", "release"]
depends-on = ["configure", "build-vtk"]
#inputs = ["CMakeLists.txt", "src/*"]

[tasks.run]
# Run task that depends on build
cmd = ".build/bin/joint-track-machine-learning"
depends-on = ["build"]
# Wayland's EGL stack on this machine can't give QVTKOpenGLNativeWidget a GL
# context (blank render window); xcb (X11/GLX) works. Default the app to xcb.
env = {"QT_QPA_PLATFORM" = "xcb"}
#set(USE_CUDNN 1)
#
[tasks.cargo-build]
cmd = "cargo build --manifest-path rust/Cargo.toml"

[tasks.test]
# Run the headless suite: no GUI/display or VTK render window. Fast compute-only
# CUDA tests are allowed; expensive fixture/render/performance gates use -L oracle.
cmd = ["ctest", "--test-dir", ".build", "--output-on-failure", "--timeout", "600", "-L", "headless"]
depends-on = ["build"]
env = {"QT_QPA_PLATFORM" = "offscreen"}

[tasks.check-display]
cmd = """
    echo "DISPLAY=$DISPLAY"
    echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"
    echo "XDG_SESSION_TYPE=$XDG_SESSION_TYPE"
    echo "GDK_BACKEND=$GDK_BACKEND"
    echo "QT_QPA_PLATFORM=$QT_QPA_PLATFORM"
"""

[tasks.format]
cmd = ["bash", "format.sh"]
depends-on = ["configure"]

[tasks.tidy]
cmd = ["bash", "tidy.sh", "--path", ".build"]
depends-on = ["configure"]

[environments]
build = ["build"]
dev = ["build", "dev"]
profile = { features = ["build", "profile"], solve-group = "default" }

[activation.env]
Qt6_DIR = "${CONDA_PREFIX}/lib/cmake/Qt6"
Torch_DIR = "${CONDA_PREFIX}/lib/cmake/Torch"
OpenCV_DIR = "${CONDA_PREFIX}/lib/cmake/opencv4"

# Project-built VTK: intentionally independent of Pixi environment
VTK_DIR = "${PIXI_PROJECT_ROOT}/_deps/vtk/install/lib64/cmake/vtk-9.7"

CUDA_HOME = "${CONDA_PREFIX}"
CUDA_TOOLKIT_ROOT_DIR = "${CONDA_PREFIX}"
CUDACXX = "${CONDA_PREFIX}/bin/nvcc"

CXX = "clang++"
CC = "clang"



[feature.profile.activation.env]
RUSTFLAGS = "-C force-frame-pointers=yes -C debuginfo=1"

[feature.profile.tasks.configure-profile]
cmd = ["cmake", "--preset", "profile"]
depends-on = [
    { task = "build-vtk", environment = "default" }
]

[feature.profile.tasks.build-profile]
cmd = ["cmake", "--build", "--preset", "profile"]
depends-on = ["configure-profile"]

[feature.profile.tasks.run-profile]
cmd = ".build-prof/bin/joint-track-machine-learning"
depends-on = ["build-profile"]
env = { QT_QPA_PLATFORM = "xcb" }

[feature.profile.tasks.nsys-prof]
cmd = [
    "nsys", "profile",
    "--trace=cuda,nvtx,osrt",
    "--opengl-gpu-workload=false",
    "--sample=process-tree",
    "--backtrace=fp",
    "--resolve-symbols=true",
    "--stats=true",
    "--wait=primary",
    "-o", "profiler/jtml-%n",
    ".build-prof/bin/joint-track-machine-learning",
]
depends-on = ["build-profile"]
env = { QT_QPA_PLATFORM = "xcb" }



[feature.profile.tasks.nsys-cpu]
cmd = [
    "nsys", "profile",
    "--trace=nvtx,osrt",
    "--opengl-gpu-workload=false",
    "--sample=process-tree",
    "--backtrace=dwarf",
    "--resolve-symbols=true",
    "--stats=true",
    "--wait=primary",
    "-o", "profiler/jtml-%n",
    ".build-prof/bin/joint-track-machine-learning",
]
depends-on = ["build-profile"]
env = { QT_QPA_PLATFORM = "xcb" }
