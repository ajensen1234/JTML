[workspace]
name = "joint-track-machine-learning"
version = "0.1.0"
description = "Joint Track Machine Learning Project"
authors = ["Your Name <your.email@example.com>"]
channels = ["https://prefix.dev/conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12.9" }]

[dependencies]
# Core dependencies
opencv = ">=5.0.0,<6"
pytorch-gpu = ">=2.13.0,<3"
cuda-version = ">=12.9,<13"
cuda = ">=12.9.2,<13"
eigen = ">=5.0.1,<6"
ninja = ">=1.13.2,<2"
nvtx = ">=0.2.16,<0.3"

# Display dependencies
xorg-libx11 = ">=1.8.13,<2"
xorg-libxt = ">=1.3.1,<2"
xorg-libxext = ">=1.3.7,<2"
curl = ">=8.18.0,<9"
libcurl = ">=8.18.0,<9"
cmake = ">=4.2.3,<5"
wget = ">=1.25.0,<2"
tar = ">=1.35,<2"
ccache = ">=4.14,<5"
#gcc = "*"
sdl2 = ">=2.32.56,<3"
libopengl = ">=1.7.0,<2"
glew = ">=2.3.0,<3"
libegl-devel = ">=1.7.0,<2"
libgles-devel = ">=1.7.0,<2"
libopengl-devel = ">=1.7.0,<2"
clang-tools = "19.*"
catch2 = ">=3.16.0,<4"
qt6-main = ">=6.10.2,<7"
qt6-wayland = ">=6.10.2,<7"
cuda-toolkit = ">=12.9.2,<13"
bibtexparser = ">=1.4.4,<2"
clang = ">=19.1.7,<20"
clangxx = ">=19.1.7,<20"
cuda-nvtx-dev = ">=12.9.79,<13"
cuda-nvtx = ">=12.9.79,<13"
pyyaml = ">=6.0.3,<7"
rust = ">=1.98.0,<1.99"

[feature.build.dependencies]
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
#gcc = "*"
cxx-compiler = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"
cuda = ">=12.9.2,<13"
clang = ">=19.1.7,<20"
clangxx = ">=19.1.7,<20"
cuda-nvtx-dev = ">=12.9.79,<13"

# Development dependencies
[feature.dev.dependencies]
freetype = ">=2.14.3,<3"
fontconfig = ">=2.18.3,<3"
expat = ">=2.8.1,<3"
libpng = ">=1.6.58,<2"
zlib = ">=1.3.2,<2"
brotli = ">=1.2.0,<2"
pkg-config = ">=0.29.2,<0.30"

[tasks.build-vtk]
cmd = ["./vtk_installer.sh"]
# inputs/outputs make pixi skip the (long) VTK rebuild unless the installer
# script changes or the cache disappears (was re-running every invocation).
inputs = ["vtk_installer.sh"]
outputs = ["_deps/vtk/build/CMakeCache.txt"]

[tasks.configure]
# Configure CMake with Ninja generator
cmd = ["cmake",
    "-GNinja",
    "-S.", 
    "-B.build",
    "-DCMAKE_PREFIX_PATH=$CONDA_PREFIX",
    "-DCMAKE_IGNORE_PATH=$HOME/.nix-profile/:/nix/:/usr/local/cuda/lib64:/usr/lib64:/usr/lib",
    "-DCMAKE_BUILD_TYPE=Release",
    "-DCMAKE_CUDA_COMPILER=$CONDA_PREFIX/bin/nvcc",
    "-DCUDA_TOOLKIT_ROOT_DIR=$CONDA_PREFIX",
    "-DCUDA_SDK_ROOT_DIR=$CONDA_PREFIX",
    "-DCUDA_CUDA_LIB=$CONDA_PREFIX/lib/stubs/libcuda.so",
    "-DCUDA_NVRTC_LIB=$CONDA_PREFIX/lib/libnvrtc.so",
    "-DTorch_DIR=$CONDA_PREFIX/lib/cmake/Torch",
    "-DOpenCV_DIR=$CONDA_PREFIX/lib/cmake/opencv4",
    "-DQt6_DIR=$CONDA_PREFIX/lib/cmake/Qt6",
    "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "-DCMAKE_CXX_COMPILER=clang++",
    "-DCMAKE_C_COMPILER=clang",
    "-DCMAKE_CUDA_HOST_COMPILER=clang++",
    "-DCUDA_INCLUDE_DIRS=$CONDA_PREFIX/targets/x86_64-linux/include",
    "-DUSE_SYSTEM_NVTX:BOOL=ON",
    "-Dnvtx3_dir=$CONDA_PREFIX/targets/x86_64-linux/include",
    "-DTORCH_CUDA_ARCH_LIST=8.6 8.9 12.0",
  "-DCMAKE_CUDA_ARCHITECTURES=native",
  "-DUSING_CPP_COST=ON",
]
#inputs = ["CMakeLists.txt"]
depends-on = ["build-vtk"]

# Plan 007 U7: profiling build — same recipe as configure plus QML debugging
# (-DQT_QML_DEBUG: qmlprofiler needs it for binding/JS/handling-signal
# events) into a separate .build-prof dir so the normal build stays clean.
# qmlprofiler: $CONDA_PREFIX/lib/qt6/bin/qmlprofiler (the Qt 6.7.2 binary;
# the bare `qmlprofiler` on PATH is Qt 5.15.8).
[tasks.configure-profiling]
cmd = ["cmake",
    "-GNinja",
    "-S.",
    "-B.build-prof",
    "-DCMAKE_PREFIX_PATH=$CONDA_PREFIX",
    "-DCMAKE_IGNORE_PATH=$HOME/.nix-profile/:/nix/:/usr/local/cuda/lib64:/usr/lib64:/usr/lib",
    "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
    "-DCMAKE_CXX_FLAGS=-DQT_QML_DEBUG",
    "-DCMAKE_CUDA_COMPILER=$CONDA_PREFIX/bin/nvcc",
    "-DCUDA_TOOLKIT_ROOT_DIR=$CONDA_PREFIX",
    "-DCUDA_SDK_ROOT_DIR=$CONDA_PREFIX",
    "-DCUDA_CUDA_LIB=$CONDA_PREFIX/lib/stubs/libcuda.so",
    "-DCUDA_NVRTC_LIB=$CONDA_PREFIX/lib/libnvrtc.so",
    "-DCUDA_INCLUDE_DIRS=$CONDA_PREFIX/targets/x86_64-linux/include",
    "-DTorch_DIR=$CONDA_PREFIX/lib/cmake/Torch",
    "-DOpenCV_DIR=$CONDA_PREFIX/lib/cmake/opencv4",
    "-DLIBNVTOOLSEXT=$CONDA_PREFIX/lib/libnvToolsExt.so.1",
    "-DQt6_DIR=$CONDA_PREFIX/lib/cmake/Qt6",
    "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "-DUSE_SYSTEM_NVTX=ON",
]
#inputs = ["CMakeLists.txt"]
depends-on = ["build-vtk"]

[tasks.build-profiling]
cmd = ["cmake", "--build", ".build-prof"]

[tasks.build]
# Build task that depends on configure
cmd = ["cmake", "--build", ".build"]
depends-on = ["configure", "build-vtk"]
#inputs = ["CMakeLists.txt", "src/*"]

[tasks.run]
# Run task that depends on build
cmd = ".build/bin/joint-track-machine-learning"
depends-on = ["build"]
# Wayland's EGL stack on this machine can't give QVTKOpenGLNativeWidget a GL
# context (blank render window); xcb (X11/GLX) works. Default the app to xcb.
env = {"QT_QPA_PLATFORM" = "xcb"}
#set(USE_CUDNN 1)
#
[tasks.cargo-build]
cmd = "cargo build -m rust/Cargo.toml"

[tasks.test]
# Run the headless suite: no GUI/display or VTK render window. Fast compute-only
# CUDA tests are allowed; expensive fixture/render/performance gates use -L oracle.
cmd = ["ctest", "--test-dir", ".build", "--output-on-failure", "--timeout", "600", "-L", "headless"]
depends-on = ["build"]
env = {"QT_QPA_PLATFORM" = "offscreen"}

[tasks.check-display]
cmd = """
    echo "DISPLAY=$DISPLAY"
    echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"
    echo "XDG_SESSION_TYPE=$XDG_SESSION_TYPE"
    echo "GDK_BACKEND=$GDK_BACKEND"
    echo "QT_QPA_PLATFORM=$QT_QPA_PLATFORM"
"""

[tasks.format]
cmd = ["bash", "format.sh"]
depends-on = ["configure"]

[tasks.tidy]
cmd = ["bash", "tidy.sh", "--path", ".build"]
depends-on = ["configure"]

[environments]
build = ["build"]
dev = ["build", "dev"]

[activation.env]
Qt6_DIR = "${CONDA_PREFIX}/lib/cmake/Qt6"
VTK_DIR = "${CONDA_PREFIX}/lib/cmake/vtk-9.7"
Torch_DIR = "${CONDA_PREFIX}/lib/cmake/Torch"
OpenCV_DIR = "${CONDA_PREFIX}/lib/cmake/opencv4"
CUDA_HOME = "${CONDA_PREFIX}"
CUDA_TOOLKIT_ROOT_DIR = "${CONDA_PREFIX}"
CUDACXX = "${CONDA_PREFIX}/bin/nvcc"
CXX="clang++"
CC="clang"

