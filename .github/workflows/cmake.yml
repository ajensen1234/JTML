# CI: configure the pixi project, build, and run the headless test suite.
# The default `pixi run test` runs the `headless` ctest label only (no GUI, no
# GPU). GPU/oracle cases are gated externally on GPU machines (see plan U2/U6).

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # VTK is expected to be fetched/built by `pixi run configure` in CI.
      # If that is too heavy for the runner, swap this job to use the
      # conda-forge `vtk` package (see plan U8) and drop build-vtk.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          cache: true
          cache-write: true

      - name: Configure
        run: pixi run configure

      - name: Build
        run: pixi run build

      - name: Test (headless)
        run: pixi run test
